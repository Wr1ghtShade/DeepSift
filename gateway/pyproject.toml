[project]
name = "deepsift-gateway"
version = "0.1.0"
description = "DeepSift gateway: REST and WebSocket API, service registry, pivot engine"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5",
]

[project.optional-dependencies]
# Run services in-process when no Redis is configured (single-user install).
services = ["deepsift[all]"]

[project.scripts]
deepsift-gateway = "deepsift_gateway.main:main"

[tool.uv.sources]
deepsift-sdk = { workspace = true }
deepsift = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_gateway"]
