[project]
name = "deepsift"
version = "0.1.0"
description = "DeepSift command line: OSINT investigations from the terminal"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
sherlock = ["deepsift-svc-sherlock"]
maigret = ["deepsift-svc-maigret"]
avatar-hash = ["deepsift-svc-avatar-hash"]
holehe = ["deepsift-svc-holehe"]
gravatar = ["deepsift-svc-gravatar"]
dns-mail = ["deepsift-svc-dns-mail"]
phone-meta = ["deepsift-svc-phone-meta"]
ignorant = ["deepsift-svc-ignorant"]
whatsapp = ["deepsift-svc-whatsapp"]
telegram = ["deepsift-svc-telegram"]
all = [
  "deepsift-svc-sherlock",
  "deepsift-svc-maigret",
  "deepsift-svc-avatar-hash",
  "deepsift-svc-holehe",
  "deepsift-svc-gravatar",
  "deepsift-svc-dns-mail",
  "deepsift-svc-phone-meta",
  "deepsift-svc-ignorant",
]

[project.scripts]
deepsift = "deepsift_cli.main:app"

[tool.uv.sources]
deepsift-sdk = { workspace = true }
deepsift-svc-sherlock = { workspace = true }
deepsift-svc-maigret = { workspace = true }
deepsift-svc-avatar-hash = { workspace = true }
deepsift-svc-holehe = { workspace = true }
deepsift-svc-gravatar = { workspace = true }
deepsift-svc-dns-mail = { workspace = true }
deepsift-svc-phone-meta = { workspace = true }
deepsift-svc-ignorant = { workspace = true }
deepsift-svc-whatsapp = { workspace = true }
deepsift-svc-telegram = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_cli"]
