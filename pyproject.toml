[project]
name = "deepsift-workspace"
version = "0.0.0"
description = "DeepSift monorepo (uv workspace): SDK, CLI and services"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "cli", "services/sherlock", "services/maigret", "services/avatar-hash", "services/holehe", "services/gravatar", "services/dns-mail", "services/phone-meta", "services/ignorant", "services/whatsapp"]

[tool.uv.sources]
deepsift-sdk = { workspace = true }
deepsift = { workspace = true }
deepsift-svc-sherlock = { workspace = true }
deepsift-svc-maigret = { workspace = true }
deepsift-svc-avatar-hash = { workspace = true }
deepsift-svc-holehe = { workspace = true }
deepsift-svc-gravatar = { workspace = true }
deepsift-svc-dns-mail = { workspace = true }
deepsift-svc-phone-meta = { workspace = true }
deepsift-svc-ignorant = { workspace = true }
deepsift-svc-whatsapp = { workspace = true }

[dependency-groups]
dev = [
  "deepsift-sdk",
  "deepsift",
  "deepsift-svc-sherlock",
  "deepsift-svc-maigret",
  "deepsift-svc-avatar-hash",
  "deepsift-svc-holehe",
  "deepsift-svc-gravatar",
  "deepsift-svc-dns-mail",
  "deepsift-svc-phone-meta",
  "deepsift-svc-ignorant",
  "deepsift-svc-whatsapp",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "fakeredis>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "cli/tests", "services/sherlock/tests", "services/maigret/tests", "services/avatar-hash/tests", "services/holehe/tests", "services/gravatar/tests", "services/dns-mail/tests", "services/phone-meta/tests", "services/ignorant/tests", "services/whatsapp/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["sdk/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
