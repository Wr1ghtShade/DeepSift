[project]
name = "deepsift-workspace"
version = "0.0.0"
description = "DeepSift monorepo (uv workspace): SDK, CLI and services"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "cli", "services/sherlock", "services/maigret"]

[tool.uv.sources]
deepsift-sdk = { workspace = true }
deepsift = { workspace = true }
deepsift-svc-sherlock = { workspace = true }
deepsift-svc-maigret = { workspace = true }

[dependency-groups]
dev = [
  "deepsift-sdk",
  "deepsift",
  "deepsift-svc-sherlock",
  "deepsift-svc-maigret",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "fakeredis>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "cli/tests", "services/sherlock/tests", "services/maigret/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["sdk/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
