# SearXNG settings for DeepSift's own instance (compose service "searxng").
# Only the differences from SearXNG's defaults are listed.
# Reference: https://docs.searxng.org/admin/settings/index.html
use_default_settings: true

general:
  instance_name: "DeepSift SearXNG"

search:
  safe_search: 0
  # DeepSift calls /search?format=json: the json format must be allowed.
  formats:
    - html
    - json

server:
  # Set SEARXNG_SECRET in your .env; SearXNG reads it instead of this value.
  secret_key: "change-me-with-SEARXNG_SECRET"
  # The instance is only reachable by DeepSift on the internal network (and on
  # 127.0.0.1:47880 from the host), so the public-instance bot limiter is off.
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true
