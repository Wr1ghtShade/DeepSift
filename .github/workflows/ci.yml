name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/whatsapp  # lets the Python-to-Node bridge test run
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/whatsapp/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [test, node]
    strategy:
      matrix:
        service: [sherlock, maigret, avatar-hash, holehe, gravatar, dns-mail, phone-meta, ignorant, whatsapp]
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.service }} service image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t deepsift/svc-${{ matrix.service }} .
