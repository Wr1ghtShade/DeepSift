name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/whatsapp  # lets the Python-to-Node bridge test run
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/whatsapp/package-lock.json
      - run: npm ci
      - run: npm test

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, node]
    strategy:
      matrix:
        service: [sherlock, maigret, avatar-hash, holehe, gravatar, dns-mail, phone-meta, ignorant, searxng, tineye, telegram, whatsapp]
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.service }} service image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t deepsift/svc-${{ matrix.service }} .

  docker-gateway:
    runs-on: ubuntu-latest
    needs: [test, gui]
    steps:
      - uses: actions/checkout@v4
      - name: Build the gateway image
        run: docker build -f gateway/Dockerfile -t deepsift/gateway .
      - name: Start it and check health and security headers
        run: |
          docker run -d --name gw -p 127.0.0.1:8000:8000 -e DEEPSIFT_API_TOKEN=ci-token deepsift/gateway
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8000/api/v1/services
          curl -sSI http://127.0.0.1:8000/api/v1/health | grep -i "content-security-policy: default-src 'none'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/investigations)" = 401
          curl -fsS -D headers.txt -o index.html http://127.0.0.1:8000/
          grep -i "content-security-policy: script-src 'nonce-" headers.txt
          grep -q 'nonce="' index.html && ! grep -q '__CSP_NONCE__' index.html
