name: Release

# Builds every package (the gateway wheel embeds the GUI) on a version tag.
# Publishing to PyPI uses trusted publishing: configure the "pypi" environment and each
# project on pypi.org, then set the repository variable PUBLISH_TO_PYPI to "true".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Build the GUI into the gateway package
        run: |
          cd gui && npm ci && npm run build && cd ..
          rm -rf gateway/src/deepsift_gateway/static
          cp -r gui/dist gateway/src/deepsift_gateway/static
      - uses: astral-sh/setup-uv@v6
      - name: Build wheels and sdists
        run: uv build --all-packages --out-dir dist
      - name: Check the gateway wheel carries the GUI and the migrations
        run: |
          unzip -l dist/deepsift_gateway-*.whl | grep -q "deepsift_gateway/static/index.html"
          unzip -l dist/deepsift_gateway-*.whl | grep -q "migrations/versions/0001_initial_schema.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
