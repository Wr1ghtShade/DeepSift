# DeepSift stack — work in progress.
#
#   cp .env.example .env   # then fill in SEARXNG_SECRET and any API keys
#   mkdir -p secrets
#   openssl rand -hex 24 > secrets/postgres_password.txt
#   openssl rand -base64 32 > secrets/api_token.txt
#   docker compose up --build
#
# Open http://127.0.0.1:8000 and log in with the token from secrets/api_token.txt.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepsift
      POSTGRES_USER: deepsift
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      DEEPSIFT_REDIS_URL: redis://redis:6379/0
      DEEPSIFT_DATABASE_URL: postgresql+asyncpg://deepsift@postgres/deepsift
      DEEPSIFT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DEEPSIFT_API_TOKEN_FILE: /run/secrets/api_token
      DEEPSIFT_BLOBS_DIR: /data/blobs
      DEEPSIFT_ALLOWED_ORIGINS: ${DEEPSIFT_ALLOWED_ORIGINS:-}
    secrets:
      - postgres_password
      - api_token
    volumes:
      - blobs:/data/blobs
    ports:
      - "127.0.0.1:${DEEPSIFT_PORT:-8000}:8000"
    depends_on:
      - redis
      - postgres

  # Your own meta-search instance, used by the searxng service. Reachable from the
  # host on 127.0.0.1:8080 only. Settings: deploy/searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
    volumes:
      - ./deploy/searxng:/etc/searxng
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"

  svc-searxng:
    build:
      context: .
      dockerfile: services/searxng/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
    depends_on:
      - redis
      - searxng

  svc-sherlock:
    build:
      context: .
      dockerfile: services/sherlock/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-maigret:
    build:
      context: .
      dockerfile: services/maigret/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-avatar-hash:
    build:
      context: .
      dockerfile: services/avatar-hash/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - blobs:/data/blobs  # shared blob store: Telegram writes pictures, TinEye reads them
    depends_on:
      - redis

  svc-holehe:
    build:
      context: .
      dockerfile: services/holehe/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-gravatar:
    build:
      context: .
      dockerfile: services/gravatar/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      GRAVATAR_API_KEY: ${GRAVATAR_API_KEY:-}
    depends_on:
      - redis

  svc-dns-mail:
    build:
      context: .
      dockerfile: services/dns-mail/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-phone-meta:
    build:
      context: .
      dockerfile: services/phone-meta/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-ignorant:
    build:
      context: .
      dockerfile: services/ignorant/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-tineye:
    build:
      context: .
      dockerfile: services/tineye/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      TINEYE_API_KEY: ${TINEYE_API_KEY:-}
    volumes:
      - blobs:/data/blobs
    depends_on:
      - redis

  # Off by default: read services/telegram/README.md, then
  #   docker compose --profile telegram run --rm svc-telegram deepsift-telegram login
  #   docker compose --profile telegram up -d svc-telegram
  svc-telegram:
    profiles: [telegram]
    build:
      context: .
      dockerfile: services/telegram/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - telegram-data:/data/telegram
      - blobs:/data/blobs
    depends_on:
      - redis

  # Off by default: read services/whatsapp/README.md, then
  #   docker compose --profile whatsapp run --rm svc-whatsapp link --phone +33…
  #   docker compose --profile whatsapp up -d svc-whatsapp
  svc-whatsapp:
    profiles: [whatsapp]
    build:
      context: .
      dockerfile: services/whatsapp/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - whatsapp-data:/data
    depends_on:
      - redis

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  api_token:
    file: ./secrets/api_token.txt

volumes:
  blobs:
  telegram-data:
  whatsapp-data:
  redis-data:
  postgres-data:
