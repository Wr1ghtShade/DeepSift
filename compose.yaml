# DeepSift stack — work in progress.
# The gateway and the GUI are not built yet: for now this runs the
# infrastructure and the service workers, which wait for tasks on Redis.
#
#   mkdir -p secrets && openssl rand -hex 24 > secrets/postgres_password.txt
#   docker compose up --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepsift
      POSTGRES_USER: deepsift
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  svc-sherlock:
    build:
      context: .
      dockerfile: services/sherlock/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  svc-maigret:
    build:
      context: .
      dockerfile: services/maigret/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  redis-data:
  postgres-data:
