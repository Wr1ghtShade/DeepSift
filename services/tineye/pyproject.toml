[project]
name = "deepsift-svc-tineye"
version = "0.1.0"
description = "DeepSift service: pages where an image appears, with the TinEye API"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "httpx>=0.27",
]

[project.entry-points."deepsift.services"]
tineye = "deepsift_svc_tineye:TinEyeService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_tineye"]
