contract: 1
name: tineye
version: 0.1.0
description: Pages where an image (an avatar) appears, and when TinEye first saw it, with the TinEye API
inputs: [image]
outputs: [web_page]
links: [image_found_on]
mode: api
license: TinEye API terms (paid search bundles)
timeout: 60s
concurrency: 2
secrets: [TINEYE_API_KEY]
options:
  limit:
    type: int
    default: 20
    description: Most matching images to read
  backlinks_per_match:
    type: int
    default: 3
    description: Most pages reported for each matching image
