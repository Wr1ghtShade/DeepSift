[project]
name = "deepsift-svc-dns-mail"
version = "0.1.0"
description = "DeepSift service: mail servers (MX) of an email address or domain, and who runs them"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "dnspython>=2.6",
  "httpx>=0.27",
]

[project.entry-points."deepsift.services"]
dns-mail = "deepsift_svc_dns_mail:DnsMailService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_dns_mail"]
