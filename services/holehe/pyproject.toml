[project]
name = "deepsift-svc-holehe"
version = "0.1.0"
description = "DeepSift service: which sites an email address is registered on, with holehe"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "holehe>=1.61",
  "httpx>=0.27",
]

[project.entry-points."deepsift.services"]
holehe = "deepsift_svc_holehe:HoleheService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_holehe"]
