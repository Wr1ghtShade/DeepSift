[project]
name = "deepsift-svc-maigret"
version = "0.1.0"
description = "DeepSift service: deep username search with Maigret, with profile extraction"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "maigret>=0.6,<0.7",
]

[project.entry-points."deepsift.services"]
maigret = "deepsift_svc_maigret:MaigretService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_maigret"]
