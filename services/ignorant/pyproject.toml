[project]
name = "deepsift-svc-ignorant"
version = "0.1.0"
description = "DeepSift service: whether a phone number is used on Amazon, Instagram or Snapchat, with ignorant"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "httpx>=0.27",
  "ignorant>=1.2",
  "phonenumbers>=8.13",
]

[project.entry-points."deepsift.services"]
ignorant = "deepsift_svc_ignorant:IgnorantService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_ignorant"]
