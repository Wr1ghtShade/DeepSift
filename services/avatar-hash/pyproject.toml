[project]
name = "deepsift-svc-avatar-hash"
version = "0.1.0"
description = "DeepSift service: perceptual hashes of avatars, to spot the same picture across sites"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "httpx>=0.27",
  "imagehash>=4.3",
  "pillow>=10",
]

[project.entry-points."deepsift.services"]
avatar-hash = "deepsift_svc_avatar_hash:AvatarHashService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_avatar_hash"]
