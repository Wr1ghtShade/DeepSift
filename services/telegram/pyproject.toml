[project]
name = "deepsift-svc-telegram"
version = "0.1.0"
description = "DeepSift service: Telegram account behind a phone number or a @username (Telethon, opt-in)"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "phonenumbers>=8.13",
  "telethon>=1.36,<2",
]

[project.entry-points."deepsift.services"]
telegram = "deepsift_svc_telegram:TelegramService"

[project.scripts]
deepsift-telegram = "deepsift_svc_telegram.login:main"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_telegram"]
