[project]
name = "deepsift-svc-phone-meta"
version = "0.1.0"
description = "DeepSift service: offline phone number metadata (country, area, carrier, line type)"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "phonenumbers>=8.13",
]

[project.entry-points."deepsift.services"]
phone-meta = "deepsift_svc_phone_meta:PhoneMetaService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_phone_meta"]
