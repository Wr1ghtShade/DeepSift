[project]
name = "deepsift-svc-sherlock"
version = "0.1.0"
description = "DeepSift service: username search on ~400 sites with Sherlock"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "deepsift-sdk",
  "sherlock-project>=0.16,<0.17",
]

[project.entry-points."deepsift.services"]
sherlock = "deepsift_svc_sherlock:SherlockService"

[tool.uv.sources]
deepsift-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsift_svc_sherlock"]
