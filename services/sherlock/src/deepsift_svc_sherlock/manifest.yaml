contract: 1
name: sherlock
version: 0.1.1
description: Checks whether a username exists on ~400 sites (fast first pass)
inputs: [username]
outputs: [profile]
links: [found_on]
mode: library
license: MIT
timeout: 180s
concurrency: 2
secrets: []
options:
  site_timeout:
    type: int
    default: 15
    description: Seconds to wait for each site
  include_nsfw:
    type: bool
    default: false
    description: Also check adult sites
  exclude_sites:
    type: str
    default: ""
    description: Sites to skip, comma-separated Sherlock names (e.g. "Discord.bio, Fiverr")
